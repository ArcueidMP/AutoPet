[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autopet-image-pipeline"
version = "0.1.0"
description = "Local AutoPet v0.1 image pipeline scaffold."
requires-python = ">=3.12,<3.14"
dependencies = [
  "Pillow>=10.0,<12.0"
]

[project.optional-dependencies]
rembg = [
  "rembg[cpu]>=2.0"
]
