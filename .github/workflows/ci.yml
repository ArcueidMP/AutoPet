name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-validation:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/image-pipeline/requirements.txt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages\image-pipeline\requirements.txt

      - name: Typecheck TypeScript workspace
        run: pnpm typecheck

      - name: Build TypeScript workspace
        run: pnpm build

      - name: Typecheck Python image pipeline
        run: pnpm --filter @autopet/image-pipeline typecheck

      - name: Test Python image pipeline through pnpm
        run: pnpm --filter @autopet/image-pipeline test

      - name: Compile Python package
        run: python -m compileall packages\image-pipeline\autopet_image_pipeline

      - name: Run Python unittest suite
        run: python -m unittest discover -s packages\image-pipeline
